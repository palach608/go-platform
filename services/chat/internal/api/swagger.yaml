openapi: 3.0.0
info:
  title: Chat Service API
  version: 1.0.0
  description: Сервис чата с комнатами и WebSocket

servers:
  - url: http://localhost:8080

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Room:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        owner_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateRoomRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 255

    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        room_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        username:
          type: string
        body:
          type: string
        created_at:
          type: string
          format: date-time

paths:
  /api/v1/rooms:
    post:
      summary: Создать комнату
      tags: [Rooms]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoomRequest'
      responses:
        201:
          description: Созданная комната
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        401:
          description: Не авторизован

    get:
      summary: Получить все комнаты
      tags: [Rooms]
      security:
        - BearerAuth: []
      responses:
        200:
          description: Список комнат
          content:
            application/json:
              schema:
                type: object
                properties:
                  rooms:
                    type: array
                    items:
                      $ref: '#/components/schemas/Room'
        401:
          description: Не авторизован

  /api/v1/rooms/{id}:
    get:
      summary: Получить комнату по ID
      tags: [Rooms]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Комната
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        401:
          description: Не авторизован

    delete:
      summary: Удалить комнату
      tags: [Rooms]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        204:
          description: Удалено
        401:
          description: Не авторизован

  /api/v1/rooms/{id}/messages:
    get:
      summary: Получить сообщения комнаты
      tags: [Rooms]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        200:
          description: Список сообщений
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
        401:
          description: Не авторизован

  /api/v1/ws/{roomID}:
    get:
      summary: WebSocket подключение к комнате
      tags: [WebSocket]
      parameters:
        - name: roomID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: token
          in: query
          required: true
          description: JWT токен (передаётся в query т.к. WebSocket не поддерживает заголовки)
          schema:
            type: string
      responses:
        101:
          description: Switching Protocols — соединение установлено
        401:
          description: Не авторизован